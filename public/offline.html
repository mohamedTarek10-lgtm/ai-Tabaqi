<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>مفيش إنترنت | لقمتي Luqmati</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      min-height: 100vh;
      background-color: #06040f;
      color: #f0eeff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
    }
    .card {
      padding: 40px 24px;
      max-width: 380px;
      width: 90%;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 24px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.5);
    }
    h1 {
      font-size: 22px;
      margin-bottom: 12px;
      color: #a78bfa;
    }
    p {
      font-size: 14px;
      color: #a09abc;
      line-height: 1.6;
      margin-bottom: 24px;
    }
    .btn {
      display: inline-block;
      padding: 12px 24px;
      border-radius: 14px;
      background: linear-gradient(135deg, #a78bfa, #7c3aed);
      color: #fff;
      text-decoration: none;
      font-weight: bold;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div class="card">
    <div style="font-size: 52px; margin-bottom: 16px;">📶</div>
    <h1>أنت غير متصل بالإنترنت</h1>
    <p>تطبيق <strong>لقمتي</strong> يعمل بدون إنترنت لتصفح السجل والوجبات السابقة. لتحليل وجبة جديدة باستخدام الذكاء الاصطناعي، يرجى الاتصال بالإنترنت.</p>
    <a href="/history" class="btn">تصفح سجل الوجبات المحفوظة</a>
  </div>
</body>
</html>
